# =====================================================================
#  ShinyApps app-layer bundle builder (Route A) -- HARDENED.
#  Builds prebuilt desktop bundles (win-x64, mac-arm64) for an R/Shiny app
#  and attaches them to a GitHub Release. No shell rebuild. R 4.6.1.
#
#  Reliability design (learned from real onboardings):
#   * dependency graph from the SOURCE index (binary index is incomplete on
#     a brand-new R and silently drops edges)
#   * per-package binary->source install (Bioc annotations/TxDb have no
#     binaries for a new R)
#   * fix-up loop over installed DESCRIPTIONs (catches dropped transitive deps)
#   * load validation: every required seed package must load from rlib
#   * base-priority packages are excluded from the required check
#   * macOS: optional source rebuild + otool portability audit (CRAN macOS
#     binaries can hard-link XQuartz/Homebrew)
#   * size guard against the 2 GiB GitHub Release asset limit
#
#  Modes (auto-detected when APP_MODE=auto):
#   * flat           - the repo IS the app (app.R, or ui.R+server.R, or legacy
#                      shinyUI/shinyServer). Sources are copied verbatim; the
#                      runtime runs the directory. No entry is synthesized.
#   * package-fn     - the app is an R package whose exported function returns
#                      a shinyApp object; ENTRY_FN is that call.
#   * package-deploy - the app is a dir inside an R package that reads package
#                      internals; the app files are copied + library() lines
#                      prepended + data supplied via an RData (mirrors the
#                      package's own deploy_*() helper).
# =====================================================================
name: Build app bundle

# The standard workflow is release-only: publish a GitHub Release to build.
# A tag push alone no longer triggers this workflow.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.1.1)"
        required: true
        type: string

permissions:
  contents: read

env:
  APP_ID: "exmort"
  APP_NAME: "exmort"
  APP_AUTHOR: "Shanlong Ding"
  APP_DESC: "All-cause and excess mortality calculator"
  APP_HOMEPAGE: "https://github.com/shanlong-who/exmort"
  APP_LICENSE: "GPL-3"
  APP_MODE: "flat"
  APP_SUBDIR: "inst/app"
  PKG_SUBDIR: "."
  ENTRY_FN: ""
  UI_LIBS: ""
  SERVER_LIBS: ""
  DEMO_RDA: ""
  DEMO_OBJECT: ""
  DEMO_SAVE_AS: ""
  DEMO_RDATA: ""
  EXTRA_PKGS: "officedown"
  EXCLUDE: "rsconnect,.github"
  ARCHIVE_URLS: ""
  EXTRA_REPOS: ""
  SOFT_PKGS: ""
  SOURCE_REBUILD: "gdtools"
  PREFETCH_SCRIPT: ""
  APP_NOTES: "HTML/Word reports use the Pandoc binary bundled with the app (Word also uses officedown). PDF output additionally requires a LaTeX installation, which is not bundled."
  MAX_REQUEST_MB: "1024"
  SMOKE: "on"
  SMOKE_TIMEOUT_SEC: "300"
  R_VERSION: "4.6.1"
  CRAN_SNAPSHOT: "2026-10-01"

jobs:
  bundle:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: "win-x64" }
          - { os: macos-15,       platform: "mac-arm64" }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          use-public-rspm: false

      - uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: "3.1.11"

      - name: Verify report toolchain
        shell: bash
        run: |
          if ! command -v pandoc >/dev/null 2>&1; then
            echo "::error::pandoc is required for exmort report rendering"
            exit 1
          fi
          pandoc --version | head -n 1

      - name: Install build helpers
        shell: Rscript {0}
        run: |
          snap <- Sys.getenv("CRAN_SNAPSHOT")
          cran <- if (nzchar(snap)) sprintf("https://packagemanager.posit.co/cran/%s", snap) else "https://cloud.r-project.org"
          install.packages(c("jsonlite","zip","digest","BiocManager","callr","curl"), repos = cran)

      - name: Resolve and validate version
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          V="${INPUT_TAG:-${RELEASE_TAG:-}}"
          V="${V#v}"
          if [ -z "$V" ]; then
            echo "::error::cannot resolve version from tag"
            exit 1
          fi
          TAG="v$V"
          if ! git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::tag $TAG does not exist in this checkout"
            exit 1
          fi
          TAG_COMMIT="$(git rev-parse "$TAG^{commit}")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "::error::checked-out commit $HEAD_COMMIT does not match $TAG ($TAG_COMMIT)"
            exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$HEAD_COMMIT" >> "$GITHUB_ENV"
          echo "building $TAG at $HEAD_COMMIT"

      - name: Assemble bundle (app/ + rlib/ + manifest.json)
        shell: Rscript {0}
        run: |
          app_id  <- Sys.getenv("APP_ID")
          mode    <- Sys.getenv("APP_MODE"); if (!nzchar(mode)) mode <- "auto"
          sub_    <- Sys.getenv("APP_SUBDIR"); if (!nzchar(sub_)) sub_ <- "."
          pkg_sub <- Sys.getenv("PKG_SUBDIR"); if (!nzchar(pkg_sub)) pkg_sub <- "."
          root    <- getwd()
          bundle  <- file.path(root, "bundle"); unlink(bundle, recursive = TRUE); dir.create(bundle, recursive = TRUE)
          appdir  <- file.path(bundle, "app"); dir.create(appdir, recursive = TRUE)
          lib     <- file.path(bundle, "rlib"); dir.create(lib, recursive = TRUE)
          .libPaths(c(lib, .libPaths()))
          base_pkgs <- rownames(installed.packages(priority = "base"))
          split_pkgs <- function(x) { p <- strsplit(trimws(x), "[ ,]+")[[1]]; p[nzchar(p)] }
          dcf_deps <- function(dcf, fields = c("Depends","Imports","LinkingTo")) {
            f <- intersect(fields, colnames(dcf)); if (!length(f)) return(character())
            v <- na.omit(unlist(dcf[1, f]))
            v <- trimws(sub("[[:space:]]*\\(.*\\)$", "", trimws(unlist(strsplit(paste(v, collapse = ","), ",")))))
            v[nzchar(v) & v != "R"]
          }
          opt <- function() sprintf("options(shiny.launch.browser = FALSE, shiny.maxRequestSize = %s * 1024^2)", Sys.getenv("MAX_REQUEST_MB"))
          pkgroot <- normalizePath(file.path(root, pkg_sub), winslash = "/", mustWork = FALSE)
          has_pkg <- file.exists(file.path(pkgroot, "DESCRIPTION"))
          if (has_pkg) {
            dcf0 <- read.dcf(file.path(pkgroot, "DESCRIPTION"))
            pkg_ver <- unname(dcf0[1, "Version"])
            if (!identical(as.character(pkg_ver), Sys.getenv("VERSION"))) {
              stop("version mismatch: DESCRIPTION Version=", pkg_ver,
                   " but tag/manifest version=", Sys.getenv("VERSION"))
            }
          }
          if (mode == "auto") mode <- if (!has_pkg) "flat" else if (nzchar(Sys.getenv("ENTRY_FN"))) "package-fn" else "package-deploy"

          seed <- character(); pkg_name <- ""
          if (mode == "flat") {
            src <- normalizePath(file.path(root, sub_), winslash = "/", mustWork = TRUE)
            for (p in list.files(src, all.files = TRUE, no.. = TRUE, full.names = TRUE))
              if (!basename(p) %in% c(".git", ".github")) file.copy(p, appdir, recursive = TRUE)
            for (e in split_pkgs(Sys.getenv("EXCLUDE"))) { t <- file.path(appdir, e); if (file.exists(t)) unlink(t, recursive = TRUE) }
            if (file.exists(file.path(appdir, "app.R"))) {
              if (any(grepl("runApp[[:space:]]*\\(", readLines(file.path(appdir, "app.R"), warn = FALSE)))) {
                file.rename(file.path(appdir, "app.R"), file.path(appdir, paste0(app_id, "-app.R")))
                writeLines(c(opt(), sprintf("app <- source(\"%s-app.R\")$value", app_id),
                  "if (!inherits(app, \"shiny.appobj\")) stop(\"app.R did not return a shiny app object\")", "app"),
                  file.path(appdir, "app.R"))
              }
            } else if (!file.exists(file.path(appdir, "ui.R"))) stop("flat mode: no app.R or ui.R in ", src)
            sf <- list.files(appdir, pattern = "[.](R|r|Rmd|rmd)$", recursive = TRUE, full.names = TRUE)
            txt <- paste(unlist(lapply(sf, function(f) tryCatch(readLines(f, warn = FALSE), error = function(e) character()))), collapse = "\n")
            grab <- function(pat) { x <- regmatches(txt, gregexpr(pat, txt))[[1]]; if (length(x)) gsub("[()\"']", "", sub(".*?(library|require)", "", x)) else character() }
            seed <- unique(c(grab("library\\([A-Za-z0-9._\"']+"), grab("require\\([A-Za-z0-9._\"']+"),
                             sub("::.*$", "", regmatches(txt, gregexpr("([A-Za-z][A-Za-z0-9._]+)::", txt))[[1]]),
                             split_pkgs(Sys.getenv("EXTRA_PKGS")), "shiny"))
          } else if (mode == "package-fn") {
            dcf <- read.dcf(file.path(pkgroot, "DESCRIPTION")); pkg_name <- unname(dcf[1, "Package"])
            writeLines(c(opt(), Sys.getenv("ENTRY_FN")), file.path(appdir, "app.R"))
            seed <- c(dcf_deps(dcf), split_pkgs(Sys.getenv("EXTRA_PKGS")), pkg_name)
          } else {
            dcf <- read.dcf(file.path(pkgroot, "DESCRIPTION")); pkg_name <- unname(dcf[1, "Package"])
            psrc <- normalizePath(file.path(pkgroot, "inst", sub_), winslash = "/", mustWork = TRUE)
            for (p in list.files(psrc, all.files = TRUE, no.. = TRUE, full.names = TRUE)) file.copy(p, appdir, recursive = TRUE)
            prepend <- function(f, lines) if (file.exists(f) && length(lines)) { txt <- readLines(f, warn = FALSE); writeLines(c(lines, txt), f) }
            rda <- Sys.getenv("DEMO_RDA")
            if (nzchar(rda)) {
              e <- new.env(); load(file.path(root, rda), envir = e)
              save_as <- Sys.getenv("DEMO_SAVE_AS"); if (!nzchar(save_as)) save_as <- ".SHINYSTAN_OBJECT"
              rdata <- Sys.getenv("DEMO_RDATA"); if (!nzchar(rdata)) rdata <- "sso.RData"
              assign(save_as, get(Sys.getenv("DEMO_OBJECT"), envir = e)); save(list = save_as, file = file.path(appdir, rdata))
              prepend(file.path(appdir, "global.R"), sprintf("load(\"%s\")", rdata))
            }
            ui_libs <- split_pkgs(Sys.getenv("UI_LIBS")); srv_libs <- split_pkgs(Sys.getenv("SERVER_LIBS"))
            prepend(file.path(appdir, "ui.R"), paste0("library(", ui_libs, ");"))
            prepend(file.path(appdir, "server.R"), paste0("library(", srv_libs, ");"))
            seed <- unique(c(ui_libs, srv_libs, dcf_deps(dcf), split_pkgs(Sys.getenv("EXTRA_PKGS"))))
          }
          seed <- setdiff(seed, base_pkgs)
          cat("mode:", mode, "| seed:", paste(sort(seed), collapse = ", "), "\n")

          er <- split_pkgs(Sys.getenv("EXTRA_REPOS"))
          if (length(er)) stop("EXTRA_REPOS is not allowed with a pinned CRAN snapshot; use a pinned repository instead")
          snap <- Sys.getenv("CRAN_SNAPSHOT")
          cran <- if (nzchar(snap)) sprintf("https://packagemanager.posit.co/cran/%s", snap) else "https://cloud.r-project.org"
          bioc <- BiocManager::repositories()
          if (!is.null(names(bioc))) bioc <- bioc[!grepl("cran", names(bioc), ignore.case = TRUE)]
          repos <- c(CRAN = cran, bioc)
          options(repos = repos)
          cat("CRAN:", cran, "\n")
          db <- available.packages(repos = repos, type = "source")
          soft <- split_pkgs(Sys.getenv("SOFT_PKGS"))
          dropped <- setdiff(seed, rownames(db))
          hard_dropped <- setdiff(dropped, soft)
          if (length(hard_dropped)) stop("unresolved required dependencies: ", paste(hard_dropped, collapse = ", "))
          if (length(dropped)) cat("optional/soft packages not in index:", paste(dropped, collapse = ", "), "\n")
          seed <- intersect(seed, rownames(db))
          deps <- unlist(tools::package_dependencies(seed, db = db, recursive = TRUE))
          closure_all <- unique(c(seed, deps[!is.na(deps)]))
          closure_missing <- setdiff(closure_all, c(base_pkgs, rownames(db)))
          if (length(closure_missing)) stop("unresolved transitive dependencies: ", paste(closure_missing, collapse = ", "))
          closure <- setdiff(closure_all, base_pkgs)
          cat("closure size:", length(closure), "\n")

          # Write the resolved lock BEFORE installing, then verify the installed
          # library against it. This is an enforced lock, not an inventory of
          # whatever install.packages happened to leave behind.
          platform <- "${{ matrix.platform }}"
          lock <- data.frame(
            package = closure,
            version = unname(db[closure, "Version"]),
            stringsAsFactors = FALSE
          )
          lock <- lock[order(lock$package), , drop = FALSE]
          lock_file <- sprintf("deps-%s.json", platform)
          jsonlite::write_json(lock, file.path(root, lock_file), pretty = TRUE, auto_unbox = TRUE)
          cat("resolved lock:", nrow(lock), "packages ->", lock_file, "\n")

          options(pkgType = "both")
          have <- function() basename(list.dirs(lib, recursive = FALSE))
          ins <- function(p, type = "both", deps = NA) if (length(p)) install.packages(p, lib = lib, repos = repos, type = type, dependencies = deps, Ncpus = 2)
          ins(closure)
          nb <- setdiff(closure, have()); if (length(nb)) { cat("source retry:", length(nb), "\n"); ins(nb, type = "source", deps = FALSE) }
          if (identical(unname(Sys.info()[["sysname"]]), "Darwin")) {
            sr <- split_pkgs(Sys.getenv("SOURCE_REBUILD"))
            if (length(sr)) {
              oldpath <- Sys.getenv("PATH"); pth <- strsplit(oldpath, .Platform$path.sep)[[1]]
              pth <- pth[!grepl("homebrew|linuxbrew", pth, ignore.case = TRUE)]
              Sys.setenv(PATH = paste(pth, collapse = .Platform$path.sep), PKG_CONFIG_PATH = "", PKG_CONFIG_LIBDIR = "")
              cat("macOS source rebuild (Homebrew hidden):", paste(sr, collapse = ", "), "\n")
              ins(sr, type = "source", deps = FALSE)
              Sys.setenv(PATH = oldpath)
            }
          }
          if (mode == "package-fn") { install.packages(pkgroot, lib = lib, repos = NULL, type = "source", dependencies = FALSE); if (!pkg_name %in% have()) stop("app package failed to install: ", pkg_name) }
          for (u in split_pkgs(Sys.getenv("ARCHIVE_URLS"))) { f <- tempfile(fileext = ".tar.gz"); download.file(u, f, mode = "wb", quiet = TRUE); try(install.packages(f, lib = lib, repos = NULL, type = "source", dependencies = FALSE), silent = TRUE) }

          for (i in 1:5) {
            installed <- have(); need <- character()
            for (p in installed) { d <- tryCatch(read.dcf(file.path(lib, p, "DESCRIPTION")), error = function(e) NULL); if (!is.null(d)) need <- c(need, dcf_deps(d)) }
            need <- setdiff(unique(intersect(need, rownames(db))), c(installed, base_pkgs))
            if (!length(need)) break
            cat("fix-up round", i, ":", paste(need, collapse = ", "), "\n"); ins(need)
          }

          if (identical(unname(Sys.info()[["sysname"]]), "Darwin")) {
            bins <- list.files(lib, pattern = "[.](so|dylib)$", recursive = TRUE, full.names = TRUE); bad <- character()
            for (b in bins) { o <- suppressWarnings(system2("otool", c("-L", shQuote(b)), stdout = TRUE, stderr = FALSE)); if (any(grepl("(/opt/X11|/opt/homebrew|/usr/local/opt)", o))) bad <- c(bad, b) }
            if (length(bad)) stop("non-portable dylib references: ", paste(unique(basename(bad)), collapse = ", "))
          }

          required <- setdiff(seed, c(soft, base_pkgs)); miss <- setdiff(required, have())
          if (length(miss)) stop("missing required packages: ", paste(miss, collapse = ", "))
          for (p in required) { ok <- tryCatch({ loadNamespace(p, lib.loc = lib); TRUE }, error = function(e) { cat("LOAD FAILED:", p, "->", conditionMessage(e), "\n"); FALSE }); if (!ok) stop("seed package cannot be loaded from rlib: ", p) }
          soft_missing <- setdiff(intersect(soft, seed), c(have(), base_pkgs))
          cat("rlib packages:", length(have()), "| soft missing:", paste(soft_missing, collapse = ","), "\n")

          installed_tbl <- as.data.frame(installed.packages(lib.loc = lib), stringsAsFactors = FALSE)
          missing_lock <- setdiff(lock$package, installed_tbl$Package)
          if (length(missing_lock)) stop("resolved lock packages are missing from rlib: ", paste(missing_lock, collapse = ", "))
          installed_ver <- setNames(installed_tbl$Version, installed_tbl$Package)
          mismatch <- lock$package[lock$version != installed_ver[lock$package]]
          if (length(mismatch)) {
            stop("installed versions do not match the resolved lock: ",
                 paste(sprintf("%s (lock %s, installed %s)", mismatch,
                               lock$version[match(mismatch, lock$package)],
                               installed_ver[mismatch]), collapse = ", "))
          }
          extra <- setdiff(installed_tbl$Package, lock$package)
          if (length(extra)) stop("installed packages are not in the resolved lock: ", paste(extra, collapse = ", "))
          cat("dependency lock validation OK:", nrow(lock), "packages\n")

          entry <- if (file.exists(file.path(appdir, "app.R"))) "app/app.R" else "app/ui.R"
          pkgs <- installed_tbl
          notes <- Sys.getenv("APP_NOTES"); if (length(soft_missing)) notes <- paste0(notes, " Not bundled: ", paste(soft_missing, collapse = ", "), ".")
          man <- list(schema = 1L, id = app_id, name = Sys.getenv("APP_NAME"), version = Sys.getenv("VERSION"),
            author = Sys.getenv("APP_AUTHOR"), description = Sys.getenv("APP_DESC"), homepage = Sys.getenv("APP_HOMEPAGE"),
            license = Sys.getenv("APP_LICENSE"), runtime = "r-shiny", entry = entry, platform = "${{ matrix.platform }}",
            r_version = Sys.getenv("R_VERSION"), min_shell_version = "0.1.0", notes = notes,
            packages = lapply(seq_len(nrow(pkgs)), function(i) list(name = pkgs$Package[i], version = pkgs$Version[i], path = file.path("rlib", pkgs$Package[i]), source = "cran")))
          jsonlite::write_json(man, file.path(bundle, "manifest.json"), pretty = TRUE, auto_unbox = TRUE)

      - name: Bundle Pandoc and patch the report environment
        shell: bash
        run: |
          mkdir -p bundle/app/pandoc
          cp "$(command -v pandoc)" bundle/app/pandoc/
          ls -l bundle/app/pandoc
          if [ -f bundle/app/pandoc/pandoc.exe ]; then
            bundle/app/pandoc/pandoc.exe --version | head -n 1
          else
            bundle/app/pandoc/pandoc --version | head -n 1
          fi
          # Make rmarkdown::find_pandoc() use the bundled binary without
          # changing the app source at the release tag.
          cat > /tmp/exmort-pandoc-env.R <<'EOF'
          pandoc_dir <- file.path(getwd(), "pandoc")
          if (dir.exists(pandoc_dir)) {
            Sys.setenv(RSTUDIO_PANDOC = pandoc_dir)
            Sys.setenv(PATH = paste(pandoc_dir, Sys.getenv("PATH"), sep = .Platform$path.sep))
          }
          EOF
          cat /tmp/exmort-pandoc-env.R bundle/app/app.R > /tmp/exmort-app.R
          mv /tmp/exmort-app.R bundle/app/app.R
          head -n 7 bundle/app/app.R

      - name: Validate dependency closure in isolation
        shell: Rscript {0}
        run: |
          platform <- "${{ matrix.platform }}"
          lib <- normalizePath(file.path("bundle", "rlib"), winslash = "/", mustWork = TRUE)
          lock <- jsonlite::fromJSON(sprintf("deps-%s.json", platform))
          callr::r(
            function(lib, lock) {
              .libPaths(c(lib, .Library))
              installed <- as.data.frame(installed.packages(lib.loc = lib), stringsAsFactors = FALSE)
              missing <- setdiff(lock$package, installed$Package)
              if (length(missing)) stop("missing from rlib: ", paste(missing, collapse = ", "))
              versions <- setNames(installed$Version, installed$Package)
              bad <- lock$package[lock$version != versions[lock$package]]
              if (length(bad)) {
                stop("version mismatch: ", paste(sprintf("%s (lock %s, installed %s)",
                  bad, lock$version[match(bad, lock$package)], versions[bad]), collapse = ", "))
              }
              TRUE
            },
            args = list(lib = lib, lock = lock),
            env = c(R_LIBS_USER = "", R_LIBS_SITE = "")
          )
          cat("isolated dependency lock OK:", nrow(lock), "packages present\n")

      - name: Install functional test dependencies
        shell: Rscript {0}
        run: |
          snap <- Sys.getenv("CRAN_SNAPSHOT")
          cran <- if (nzchar(snap)) sprintf("https://packagemanager.posit.co/cran/%s", snap) else "https://cloud.r-project.org"
          dir.create("test-lib", showWarnings = FALSE)
          # Prefer the bundle's locked app libraries for shared dependencies;
          # put only testthat/pkgload/withr and their missing deps in test-lib.
          .libPaths(c(normalizePath(file.path("bundle", "rlib"), winslash = "/", mustWork = TRUE),
                      "test-lib", .libPaths()))
          install.packages(c("testthat", "pkgload", "withr"), lib = "test-lib", repos = cran, dependencies = TRUE)

      - name: Functional session tests (non-publishing)
        timeout-minutes: 30
        shell: Rscript {0}
        run: |
          # Runs the package's testthat suite against the bundle's rlib. These
          # tests exercise data import, model execution, lazy-loaded plots and
          # HTML report generation through Shiny testServer sessions.
          .libPaths(c(normalizePath(file.path("bundle", "rlib"), winslash = "/", mustWork = TRUE),
                      "test-lib", .libPaths()))
          testthat::test_local(reporter = "summary")

      - name: Prefetch first-launch data (optional)
        if: ${{ env.PREFETCH_SCRIPT != '' }}
        timeout-minutes: 45
        shell: Rscript {0}
        run: |
          # Run a repo-provided R script from inside the bundled app directory, with the
          # bundle's rlib on .libPaths(), so an app that downloads a database at first launch
          # generates it here and ships it (the app then finds it and never downloads). The
          # script must write into the current directory (e.g. data/<db>) and be idempotent.
          root   <- getwd()
          script <- file.path(root, Sys.getenv("PREFETCH_SCRIPT"))
          if (!file.exists(script)) stop("PREFETCH_SCRIPT not found: ", script)
          appdir <- file.path(root, "bundle", "app")
          .libPaths(c(file.path(root, "bundle", "rlib"), .libPaths()))
          options(timeout = 3600)
          old <- setwd(appdir); on.exit(setwd(old), add = TRUE)
          source(script)
          cat("prefetch done; files under the app dir:\n")
          print(list.files(".", recursive = TRUE, pattern = "[.](txt|tsv|rds|rda|sqlite)$"))
      - name: Zip + sha256 + metadata + size guard
        shell: Rscript {0}
        run: |
          platform <- "${{ matrix.platform }}"
          out <- sprintf("%s-%s-%s.zip", Sys.getenv("APP_ID"), Sys.getenv("VERSION"), platform)
          bundle <- file.path(getwd(), "bundle"); old <- setwd(bundle); on.exit(setwd(old))
          zip::zipr(out, files = list.files(".", all.files = TRUE, no.. = TRUE))
          entries <- utils::unzip(out, list = TRUE)$Name
          if (!any(grepl("^rlib/", entries))) stop("zip is missing rlib/ -- aborting")
          if (!any(grepl("^app/(app[.]R|ui[.]R)$", entries))) stop("zip is missing app/app.R or app/ui.R -- aborting")
          setwd(old); file.rename(file.path(bundle, out), out)
          sha <- digest::digest(out, algo = "sha256", file = TRUE); sz <- file.size(out)
          cat("bundle zip size (bytes):", sz, "\n")
          if (sz > 2 * 1024^3) stop("bundle exceeds the 2 GiB GitHub Release asset limit; trim modules or use a smaller closure.")
          lock_file <- sprintf("deps-%s.json", platform)
          lock_sha <- if (file.exists(lock_file)) digest::digest(lock_file, algo = "sha256", file = TRUE) else NA_character_
          pv <- tryCatch(system2("pandoc", "--version", stdout = TRUE, stderr = FALSE)[1], error = function(e) NA_character_)
          if (is.na(pv) || !nzchar(pv)) stop("pandoc is required but was not found on PATH")
          meta <- list(
            schema = 1L, app_id = Sys.getenv("APP_ID"), platform = platform,
            version = Sys.getenv("VERSION"), file = out, sha256 = sha, size = sz,
            source_repository = Sys.getenv("GITHUB_REPOSITORY"), source_commit = Sys.getenv("SOURCE_COMMIT"),
            source_ref = Sys.getenv("GITHUB_REF"), source_tag = Sys.getenv("TAG"),
            r_version = Sys.getenv("R_VERSION"), cran_snapshot = Sys.getenv("CRAN_SNAPSHOT"),
            pandoc_version = pv, dependency_lock = lock_file, dependency_lock_sha256 = lock_sha,
            package_count = nrow(utils::installed.packages(lib.loc = file.path("bundle", "rlib")))
          )
          jsonlite::write_json(meta, sprintf("meta-%s.json", platform), pretty = TRUE, auto_unbox = TRUE)
          writeLines(sprintf("%s  %s", sha, out), sprintf("meta-%s.sha256", platform))

      - name: Smoke test (start the bundle like the ShinyApps shell)
        if: ${{ env.SMOKE != 'off' }}
        timeout-minutes: 12
        shell: Rscript {0}
        run: |
          # Reproduce the ShinyApps shell's startup: put the bundle's rlib on
          # .libPaths, run shiny::runApp(), and request the root page. Runs in
          # a supervised child process with a hard timeout so it cannot hang.
          app_id <- Sys.getenv("APP_ID"); ver <- Sys.getenv("VERSION"); plat <- "${{ matrix.platform }}"
          zip <- sprintf("%s-%s-%s.zip", app_id, ver, plat)
          if (!file.exists(zip)) stop("smoke: bundle not found: ", zip)
          tmp <- tempfile("smoke"); dir.create(tmp)
          utils::unzip(zip, exdir = tmp)
          appdir <- file.path(tmp, "app"); lib <- file.path(tmp, "rlib")
          if (!dir.exists(appdir) || !dir.exists(lib)) stop("smoke: unexpected bundle layout")
          # httpuv is part of the app closure (Shiny depends on it); use the
          # bundle library for the parent process that allocates the port too.
          .libPaths(c(lib, .libPaths()))
          timeout <- suppressWarnings(as.integer(Sys.getenv("SMOKE_TIMEOUT_SEC", "300"))); if (is.na(timeout) || timeout < 30) timeout <- 300
          cat(sprintf("smoke: starting app '%s' (rlib on .libPaths)\n", app_id))
          serve <- function(appdir, lib, port) {
            .libPaths(c(lib, .Library))
            stopifnot(identical(normalizePath(.libPaths()[1], winslash = "/", mustWork = TRUE),
                                normalizePath(lib, winslash = "/", mustWork = TRUE)))
            allowed <- normalizePath(c(lib, .Library), winslash = "/", mustWork = TRUE)
            extra <- setdiff(normalizePath(.libPaths(), winslash = "/", mustWork = FALSE), allowed)
            if (length(extra)) stop("smoke: unexpected library paths: ", paste(extra, collapse = ", "))
            old <- setwd(appdir); on.exit(setwd(old), add = TRUE)
            shiny::runApp(".", port = port, host = "127.0.0.1",
                          launch.browser = FALSE, quiet = TRUE)
          }
          port <- httpuv::randomPort()
          proc <- callr::r_bg(serve, args = list(appdir = appdir, lib = lib, port = port),
                              supervise = TRUE, env = c(R_LIBS_USER = "", R_LIBS_SITE = ""))
          on.exit(try(proc$kill(), silent = TRUE), add = TRUE)
          url <- sprintf("http://127.0.0.1:%d/", port)
          deadline <- Sys.time() + timeout
          out <- character()
          repeat {
            out <- c(out, proc$read_output_lines(), proc$read_error_lines())
            if (!proc$is_alive()) {
              cat(paste(out, collapse = "\n"), "\n")
              stop("smoke test FAILED: the app exited before serving a page")
            }
            served <- tryCatch({
              h <- curl::new_handle(connecttimeout = 5L, timeout = 10L)
              r <- curl::curl_fetch_memory(url, handle = h)
              r$status_code == 200L && length(r$content) > 0 &&
                grepl("<!doctype|<html", rawToChar(r$content), ignore.case = TRUE)
            }, error = function(e) FALSE)
            if (isTRUE(served)) break
            if (Sys.time() >= deadline) {
              cat(paste(out, collapse = "\n"), "\n")
              stop("smoke test FAILED: ", url, " did not serve a page within ", timeout, "s")
            }
            Sys.sleep(1)
          }
          cat("SMOKE OK:", url, "served an HTML page\n")

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: |
            *.zip
            *.sha256
            meta-*.json
            deps-*.json

  release:
    needs: bundle
    if: github.event_name == 'release' || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Consolidate release metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, glob, hashlib, json, os

          metas, deps = {}, {}
          for path in sorted(glob.glob("artifacts/meta-*.json")):
              platform = os.path.basename(path)[5:-5]
              metas[platform] = json.load(open(path))
          for path in sorted(glob.glob("artifacts/deps-*.json")):
              platform = os.path.basename(path)[5:-5]
              deps[platform] = json.load(open(path))

          first = next(iter(metas.values()), {})
          info = {
              "app_id": first.get("app_id", "exmort"),
              "version": first.get("version", ""),
              "source_repository": first.get("source_repository", ""),
              "source_commit": first.get("source_commit", ""),
              "generated_at": datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "platforms": {
                  platform: {
                      "metadata": meta,
                      "dependencies": deps.get(platform),
                  }
                  for platform, meta in metas.items()
              },
          }
          with open("artifacts/build-info.json", "w") as fh:
              json.dump(info, fh, indent=2)
              fh.write("\n")

          lines = []
          for path in sorted(glob.glob("artifacts/*.zip")):
              digest = hashlib.sha256(open(path, "rb").read()).hexdigest()
              lines.append(f"{digest}  {os.path.basename(path)}")
          with open("artifacts/SHA256SUMS", "w") as fh:
              fh.write("\n".join(lines) + "\n")
          PY
          # Keep the per-platform files as workflow artifacts, but publish only
          # the two bundles plus the consolidated checksum/metadata files.
          rm -f artifacts/*.sha256 artifacts/meta-*.json artifacts/deps-*.json
      - name: Refuse to overwrite published assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          ERR="$(mktemp)"
          set +e
          # This job has no checkout: --repo / GH_REPO is required for gh.
          release_json="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets,name 2>"$ERR")"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            existing="$(printf '%s' "$release_json" | jq -r '.assets[]?.name')"
            for f in artifacts/*; do
              n="$(basename "$f")"
              if printf '%s\n' "$existing" | grep -qxF "$n"; then
                echo "::error::release asset already exists: $n"
                exit 1
              fi
            done
          elif grep -qiE 'release not found|HTTP 404' "$ERR"; then
            echo "release $TAG does not exist yet; the upload step will create it"
          else
            echo "::error::could not read release $TAG; refusing to guess"
            cat "$ERR"
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.release.name || github.event.inputs.tag || github.ref_name }}
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS
            artifacts/build-info.json
          overwrite_files: false
          fail_on_unmatched_files: true
          generate_release_notes: false
